/camera/camera:
  ros__parameters:
    initial_reset: true
    pointcloud:
      enable: false
    enable_gyro: true
    enable_accel: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    unite_imu_method: 2
    align_depth:
      enable: true
    depth_module:
      depth_profile: '640,480,30'
      infra_profile: '640,480,30'
    rgb_camera:
      color_profile: '640,480,30'
    gyro_fps: 200
    accel_fps: 100
    color_qos: 'DEFAULT'
    depth_qos: 'DEFAULT'
